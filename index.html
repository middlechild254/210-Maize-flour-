<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>210 Two Ten | Executive Sales Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--o:#FF6A1F;--g:#22b85a;--gold:#f3c679;--bg:#0c0a08;--bg2:#161210;--ink:#f7efe4;--mut:#a89c8c;--line:rgba(255,235,210,.12);--glass:rgba(255,245,230,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf5ee;--bg2:#fff;--ink:#1b1510;--mut:#6d6254;--line:rgba(60,35,10,.14);--glass:rgba(255,255,255,.7)}}
:root[data-theme="light"]{--bg:#faf5ee;--bg2:#fff;--ink:#1b1510;--mut:#6d6254;--line:rgba(60,35,10,.14);--glass:rgba(255,255,255,.7)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 Manrope,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Bodoni Moda',Georgia,serif;font-weight:800;line-height:1.02;margin:0;letter-spacing:-.01em}
h2{font-size:clamp(2rem,5vw,3.4rem)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--o),var(--gold),var(--g));z-index:60}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;align-items:center;gap:22px;padding:14px 5vw;backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--line)}
nav b{font:800 1.25rem 'Bodoni Moda',serif;margin-right:auto}nav b i{color:var(--o);font-style:normal}
nav a{color:var(--mut);text-decoration:none;font-weight:600;font-size:.88rem}nav a:hover{color:var(--ink)}
.h{display:none}@media(min-width:820px){.h{display:inline}}
.btn{border:0;cursor:pointer;font:800 .95rem Manrope;padding:14px 26px;border-radius:99px;color:#fff;background:linear-gradient(135deg,var(--o),#ff3d00);box-shadow:0 10px 30px rgba(255,106,31,.35);position:relative;overflow:hidden;transition:transform .2s}
.btn:hover{transform:translateY(-3px)}.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);animation:shine 4s infinite}
@keyframes shine{40%,100%{transform:translateX(120%)}}
.btn.s{background:var(--glass);border:1px solid var(--line);color:var(--ink);box-shadow:none;padding:10px 18px}.btn.s::after{display:none}
section{padding:96px 5vw;max-width:1200px;margin:auto}
.hero{min-height:100svh;max-width:none;display:grid;align-items:center;position:relative;background:radial-gradient(70% 60% at 75% 40%,rgba(255,106,31,.28),transparent 70%),radial-gradient(40% 40% at 10% 90%,rgba(34,184,90,.2),transparent 70%)}
.hero>div{max-width:1200px;margin:auto;display:grid;gap:40px;align-items:center;padding-top:60px;width:100%}
@media(min-width:900px){.hero>div{grid-template-columns:1fr 1fr}}
.hero h1{font-size:clamp(3rem,8vw,6.2rem)}
.hero h1 span{display:block;overflow:hidden}.hero h1 span b{display:block;transform:translateY(110%);animation:up 1s cubic-bezier(.2,.8,.2,1) forwards}
.hero h1 span:nth-child(2) b{animation-delay:.15s;color:var(--o)}.hero h1 span:nth-child(3) b{animation-delay:.3s}
@keyframes up{to{transform:none}}
.hero p{color:var(--mut);max-width:42ch;font-size:1.1rem}
.pk{perspective:1000px}.pk div{border-radius:26px;overflow:hidden;transform-style:preserve-3d;transition:transform .15s;box-shadow:0 50px 90px rgba(0,0,0,.55),0 0 0 1px var(--line);position:relative;animation:float 6s ease-in-out infinite}
.pk img{width:100%;display:block}.pk div::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.25),transparent 45%)}
@keyframes float{50%{translate:0 -12px}}
.live{display:inline-flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--glass);padding:8px 16px;border-radius:99px;font-weight:600;font-size:.85rem;margin-bottom:22px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--g);box-shadow:0 0 0 0 var(--g);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px transparent}}
.mq{overflow:hidden;border-block:1px solid var(--line);background:var(--bg2);padding:16px 0;white-space:nowrap}
.mq div{display:inline-block;animation:mq 28s linear infinite;font:800 1.3rem 'Bodoni Moda',serif;color:var(--gold)}.mq span{margin:0 28px}
@keyframes mq{to{transform:translateX(-50%)}}
.rv{opacity:0;transform:translateY(34px) scale(.98);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}.rv.on{opacity:1;transform:none}
.lead{color:var(--mut);max-width:58ch;margin:14px 0 36px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:24px;backdrop-filter:blur(10px)}
.kp{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kp .n{font:800 2.6rem 'Bodoni Moda',serif}.kp small{color:var(--mut)}.up{color:var(--g);font-weight:800;font-size:.85rem}
.two{display:grid;gap:16px;margin-top:16px}@media(min-width:860px){.two{grid-template-columns:1.6fr 1fr}}
svg{width:100%;height:auto;display:block}
.ln{stroke-dasharray:1200;stroke-dashoffset:1200;transition:stroke-dashoffset 2.2s ease}.on .ln{stroke-dashoffset:0}
.lb .r{display:grid;grid-template-columns:90px 1fr 70px;gap:12px;align-items:center;padding:8px 0;font-weight:600;font-size:.9rem}
.tr{height:9px;border-radius:9px;background:var(--line);overflow:hidden}.tr i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--g),var(--gold));transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
label{font-weight:700;display:flex;justify-content:space-between;margin-top:14px}input[type=range]{width:100%;accent-color:var(--o)}
.proj{font:800 3rem 'Bodoni Moda',serif;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px}.chip{border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:9px 18px;border-radius:99px;font:700 .85rem Manrope;cursor:pointer}.chip[aria-pressed=true]{background:var(--o);border-color:var(--o);color:#fff}
.cmp{display:grid;gap:14px}@media(min-width:760px){.cmp{grid-template-columns:repeat(4,1fr)}}
.cmp .glass.us{border-color:var(--o);box-shadow:0 0 50px rgba(255,106,31,.25)}
.cmp .big{font:800 2.8rem 'Bodoni Moda',serif}.cmp .us .big{color:var(--o)}
.tier{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.tier .glass{transition:transform .3s,border-color .3s}.tier .glass:hover{transform:translateY(-8px);border-color:var(--gold)}
.tier .p{font:800 2.2rem 'Bodoni Moda',serif;color:var(--gold)}.tier ul{padding-left:18px;color:var(--mut)}
.pl{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.pl h3{font-size:1.4rem;color:var(--o)}
dialog{border:1px solid var(--line);border-radius:24px;background:var(--bg2);color:var(--ink);width:min(440px,94vw);padding:26px}dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(6px)}
input[type=text],input[type=tel]{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:600 1rem Manrope;margin:6px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140px);background:var(--gold);color:#111;padding:12px 24px;border-radius:99px;font-weight:800;transition:transform .4s;z-index:70}#toast.on{transform:translate(-50%,0)}
footer{border-top:1px solid var(--line);padding:40px 5vw;text-align:center;color:var(--mut)}
.note{font-size:.8rem;color:var(--mut);margin-top:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.hero h1 span b{transform:none}}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:5px;background:var(--glass);margin-bottom:22px}
.seg button{border:0;background:none;color:var(--mut);font:800 .9rem Manrope;padding:10px 22px;border-radius:99px;cursor:pointer;transition:.3s}
.seg button[aria-pressed=true]{background:linear-gradient(135deg,var(--o),#ff3d00);color:#fff}
.sc{display:grid;gap:22px;align-items:center}@media(min-width:860px){.sc{grid-template-columns:1fr 1fr}}
.sc .em{font-size:5rem;line-height:1;position:relative;display:inline-block}
.sc .em::after{content:"~ ~ ~";position:absolute;left:12%;top:-26px;font-size:1.4rem;color:var(--gold);letter-spacing:6px;animation:steam 2.4s infinite}
@keyframes steam{0%{opacity:0;transform:translateY(14px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
.sc h3{font-size:clamp(1.8rem,4vw,2.6rem);margin:10px 0}.sc p{color:var(--mut)}
.swap{animation:swap .7s cubic-bezier(.2,.8,.2,1)}@keyframes swap{from{opacity:0;transform:translateX(26px)}}
.sel{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font:700 1rem Manrope;margin:8px 0 18px}
.road{position:relative;height:64px;margin:24px 0 8px;border-bottom:4px dashed var(--line)}
.truck{position:absolute;bottom:-6px;left:0;font-size:2.4rem;transition:left 4s linear;transform:scaleX(-1)}
.stp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-weight:700;font-size:.8rem;color:var(--mut)}
.stp span{padding:10px 4px;border-radius:12px;border:1px solid var(--line);transition:.5s}.stp span.on{background:var(--g);border-color:var(--g);color:#fff}
.fx{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.fx div{text-align:center}.fx b{display:block;font:800 1.5rem 'Bodoni Moda',serif;color:var(--gold)}
.lad{display:grid;gap:12px;grid-template-columns:repeat(4,1fr);margin-top:22px}
.lad div{border:1px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center;font-weight:700;font-size:.85rem;color:var(--mut);transition:.5s}
.lad div.on{border-color:var(--gold);color:var(--ink);background:var(--glass);box-shadow:0 0 30px rgba(243,198,121,.25);transform:translateY(-6px)}
.qt{min-height:130px}.qt blockquote{margin:0;font:500 clamp(1.3rem,3vw,1.9rem)/1.35 'Bodoni Moda',serif}.dots{display:flex;gap:8px;margin-top:16px}.dots i{width:28px;height:4px;border-radius:4px;background:var(--line)}.dots i.on{background:var(--o)}
.cf{position:fixed;top:-30px;font-size:1.8rem;z-index:80;pointer-events:none;animation:fall 2.6s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
.join{text-align:center;background:radial-gradient(60% 90% at 50% 0%,rgba(255,106,31,.3),transparent 70%),var(--glass)}
.join h2{margin-bottom:12px}.join .f{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:620px;margin:22px auto 0}.join input{flex:1 1 200px;margin:0}

.sub{display:grid;gap:30px}@media(min-width:880px){.sub{grid-template-columns:1.1fr .9fr}}
.sub h3{font-size:1.2rem;margin:4px 0 12px;color:var(--gold)}
.pks{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:10px}
.pks li{display:flex;gap:12px;align-items:center;font-weight:700;padding:12px 14px;border-radius:14px;border:1px dashed var(--line);color:var(--mut);transition:.6s}
.pks li i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);transition:.6s}
.pks li.on{color:var(--ink);border:1px solid var(--g);background:rgba(34,184,90,.1)}.pks li.on i{background:var(--g);color:#fff;transform:rotate(360deg) scale(1.1)}
.sb{background:linear-gradient(160deg,rgba(255,106,31,.2),transparent 70%),var(--glass)}
.sb .bg{font:800 4.2rem/1 'Bodoni Moda',serif;color:var(--o)}
.sv{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.sv b{display:block;font:800 1.6rem 'Bodoni Moda',serif;color:var(--gold)}.sv small{color:var(--mut)}
.rs{display:grid;position:relative;overflow:hidden}
.sl{grid-area:1/1;opacity:0;transform:translateX(70px) scale(.97);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1);pointer-events:none;position:relative}
.sl.on{opacity:1;transform:none;pointer-events:auto}.sl.out{transform:translateX(-70px) scale(.97)}
.sl::before{content:"\201C";position:absolute;right:0;top:-30px;font:800 11rem/1 'Bodoni Moda',serif;color:var(--o);opacity:.14}
.sl blockquote{margin:0 0 24px;font:500 clamp(1.3rem,3.2vw,2.1rem)/1.35 'Bodoni Moda',serif;max-width:30ch}
.sl .stars{color:var(--gold);letter-spacing:4px;font-size:1.2rem;margin-bottom:14px}
.who{display:flex;align-items:center;gap:14px}.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:800 1.1rem Manrope;color:#fff;background:linear-gradient(135deg,var(--o),var(--g))}
.who small{color:var(--mut);display:block}
.ctl{display:flex;align-items:center;gap:12px;margin-top:26px}.ctl button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);font-size:1.1rem;cursor:pointer}
.pg{display:flex;gap:8px;flex:1}.pg i{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden;cursor:pointer;position:relative}
.pg i b{position:absolute;inset:0;background:var(--o);transform:scaleX(0);transform-origin:left}.pg i.d b{transform:none}.pg i.on b{animation:fill 6s linear forwards}.rs.ps~.ctl .pg i.on b{animation-play-state:paused}
@keyframes fill{to{transform:none}}
.rate{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:22px;align-items:baseline}.rate b{font:800 3rem 'Bodoni Moda',serif;color:var(--gold)}
.ct{position:relative;background-size:cover;background-position:center;color:#f7efe4;padding:110px 5vw}
.ct::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(12,10,8,.92) 25%,rgba(12,10,8,.55))}
